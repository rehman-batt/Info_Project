<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com;">
    <title>Secure Encrypt</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>

<body>

    <header>
        <img src="https://img.icons8.com/ios-filled/50/ffffff/lock--v1.png" alt="lock" width="32" />
        <h1>Secure Encrypt</h1>
    </header>

    <div class="container">
        <h2>Text Encryption Tool</h2>

        <label class="label">Enter Text</label>
        <textarea id="textInput" placeholder="Type or paste your text here..."></textarea>

        <div>
            <button id="generateKeys">🔑 Generate Keys</button>
            <button id="encryptBtn">🔒 Encrypt Text</button>
            <button id="decryptBtn">🔓 Decrypt Text</button>
        </div>

        <div class="output" id="outputBox"></div>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>

</html>
